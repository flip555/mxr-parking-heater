# MXR parking heater — Tier 3, DOUT injection (ESP32)
#
# Same protocol and same code as Tier 0, but the frame is injected as a WIRE
# into the controller's receiver output instead of transmitted as radio.
#
# Wiring:
#   GND        -> GND
#   GPIO4      -> 1 kΩ -> CMT2220 DOUT (the pin feeding the MCU)
#   GPIO25 RX  -> Modbus data pin
#
# Why: no RF module, no antenna, no receiver saturation, exact timing.
#
# Important:
#   - The 1 kΩ resistor is mandatory. DOUT is driven push-pull by the receiver;
#     connecting two outputs directly risks damaging one of them.
#   - The physical fob stops reaching the MCU while this is connected, unless
#     you also forward received packets.
#   - Cleanest version cuts the DOUT trace and drives the MCU side only.

packages:
  tier0: !include tier0-rf-modbus.yaml

# Everything else is inherited from tier0-rf-modbus.yaml: the keyfob ID entity,
# the frame builder, the Modbus listener and the entities.
#
# If you run both files on the same network, override `name` here.
