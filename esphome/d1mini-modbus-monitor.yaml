# MXR parking heater — Tier 1, monitor only (D1 mini / ESP8266)
#
# Reads state from the Modbus bus between the controller and the burner.
# No soldering, no module removal, no transmission.
#
# Wiring:  GND -> GND,  RX (GPIO3) -> Modbus data pin.  Nothing else.
#          Power the D1 mini from its own supply.
#
# NOTE: logger is disabled on UART0 because GPIO3 is shared with it.

substitutions:
  name: mxr-heater-monitor
  friendly: MXR Heater Monitor

esphome:
  name: ${name}
  friendly_name: ${friendly}

esp8266:
  board: d1_mini

logger:
  baud_rate: 0          # REQUIRED: frees GPIO3 for the Modbus RX
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MXR Monitor Fallback"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------- Modbus ----
# Controller is the master; we only listen.
uart:
  id: modbus_uart
  rx_pin: GPIO3
  baud_rate: 9600

text_sensor:
  - platform: template
    name: "Heater Mode"
    id: mb_mode
    update_interval: never
    icon: mdi:fire
  - platform: template
    name: "Heater State"
    id: mb_state
    update_interval: never
    icon: mdi:information-outline

sensor:
  - platform: template
    name: "Heater Setpoint"
    id: mb_setpoint
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "Heater Gear"
    id: mb_gear
    accuracy_decimals: 0
    icon: mdi:fan
    update_interval: never

binary_sensor:
  - platform: template
    name: "Heater Power"
    id: mb_power
    update_interval: never

interval:
  - interval: 25ms
    then:
      - lambda: |-
          static std::vector<uint8_t> buf;   // static: persists across calls
          static uint32_t last = 0;
          uint8_t b;
          while (id(modbus_uart).available() > 0 && id(modbus_uart).read_byte(&b)) {
            buf.push_back(b);
            last = millis();
          }
          if (buf.empty() || millis() - last <= 20) return;

          // 01 10 30 00 00 04 08 | gear/mode/power | setpoint+16 | ...
          for (size_t i = 0; i + 16 < buf.size(); i++) {
            if (buf[i] == 0x01 && buf[i+1] == 0x10 &&
                buf[i+2] == 0x30 && buf[i+3] == 0x00 &&
                buf[i+4] == 0x00 && buf[i+5] == 0x04 && buf[i+6] == 0x08) {

              uint8_t st   = buf[i+7];
              uint8_t gear = (st >> 4) & 0x0F;
              uint8_t m    = st & 0x0F;
              bool power   = (m & 0x01) != 0;
              uint8_t code = (m >> 1) & 0x03;
              int temp     = (int) buf[i+8] - 16;

              const char *ms = (code == 0) ? "AC" : (code == 1 ? "Oil prime" : "Gear");

              ESP_LOGI("modbus", "gear=P%u mode=%s power=%s setpoint=%dC",
                       gear, ms, power ? "ON" : "OFF", temp);

              id(mb_mode).publish_state(ms);
              id(mb_gear).publish_state((float) gear);
              id(mb_setpoint).publish_state((float) temp);
              id(mb_power).publish_state(power);

              char st_txt[40];
              snprintf(st_txt, sizeof st_txt, "P%u %s %dC %s",
                       gear, ms, temp, power ? "ON" : "OFF");
              id(mb_state).publish_state(st_txt);
              break;
            }
          }

          buf.clear();
