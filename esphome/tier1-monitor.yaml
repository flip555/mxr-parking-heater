# MXR parking heater — Tier 1, monitor only (ESP32)
#
# Listens to the controller's Modbus mirror and publishes state. Never transmits.
# No soldering to the controller's MCU; one data wire plus ground.
#
# Wiring:
#   GND        -> GND
#   GPIO25 RX  -> Modbus data pin
#
# The controller polls the burner once a second and mirrors every settings change
# onto register 0x3000, so this works with or without a burner attached.

substitutions:
  name: mxr-monitor
  friendly: MXR Heater Monitor

esphome:
  name: ${name}
  friendly_name: ${friendly}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MXR Monitor Fallback"
    password: !secret wifi_password

captive_portal:

# ------------------------------------------------------------------ Modbus ---
uart:
  - id: modbus_uart
    rx_pin: GPIO25
    baud_rate: 9600

sensor:
  - platform: template
    name: "Setpoint"
    id: setpoint
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    name: "Mode"
    id: mode_text
    icon: mdi:thermostat
    update_interval: never

  - platform: template
    name: "Gear"
    id: gear_text
    icon: mdi:fan
    update_interval: never

binary_sensor:
  - platform: template
    name: "Power State"
    id: power_state
    device_class: running

interval:
  - interval: 25ms
    then:
      - lambda: |-
          static std::vector<uint8_t> buf;
          static uint32_t last = 0;
          uint8_t b;
          while (id(modbus_uart).available() > 0 && id(modbus_uart).read_byte(&b)) {
            buf.push_back(b);
            last = millis();
          }
          if (buf.empty() || millis() - last <= 20) return;

          // 01 10 30 00 00 04 08 | gear/mode/power | setpoint+16 | ...
          for (size_t i = 0; i + 16 < buf.size(); i++) {
            if (buf[i] == 0x01 && buf[i+1] == 0x10 &&
                buf[i+2] == 0x30 && buf[i+3] == 0x00 &&
                buf[i+4] == 0x00 && buf[i+5] == 0x04 && buf[i+6] == 0x08) {

              uint8_t st   = buf[i+7];
              uint8_t gear = (st >> 4) & 0x0F;
              uint8_t m    = st & 0x0F;
              bool power   = (m & 0x01) != 0;
              uint8_t code = (m >> 1) & 0x03;
              int temp     = (int) buf[i+8] - 16;

              const char *ms = (code == 0) ? "Auto" : (code == 1 ? "Oil prime" : "Manual");
              ESP_LOGI("modbus", "gear=P%u mode=%s power=%s setpoint=%dC",
                       gear, ms, power ? "ON" : "OFF", temp);

              id(power_state).publish_state(power);
              id(mode_text).publish_state(ms);
              id(gear_text).publish_state(std::string("P") + std::to_string(gear));
              id(setpoint).publish_state((float) temp);
              break;
            }
          }

          buf.clear();
