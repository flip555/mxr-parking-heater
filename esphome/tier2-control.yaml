# MXR parking heater — Tier 2, full control (ESP32)
#
# BT3L removed; the ESP owns the Tuya MCU UART. Modbus is read for confirmation.
#
# Wiring:
#   GND        -> GND
#   GPIO16 RX  -> BT3L pad 15
#   GPIO17 TX  -> BT3L pad 16
#   GPIO25 RX  -> Modbus data pin
#
# Loop protection: entities only transmit when the requested value differs from
# the last value the controller reported. Publishing incoming state into an
# entity therefore never causes a write back.

substitutions:
  name: mxr-heater
  friendly: MXR Heater

esphome:
  name: ${name}
  friendly_name: ${friendly}
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(mode_sel).publish_state(
            id(g_mode) == 0 ? "Manual" : (id(g_mode) == 1 ? "Auto" : "Oil prime"));
          id(gear_sel).publish_state(std::string("P") + std::to_string(id(g_gear) + 1));
          id(setpoint_n).publish_state((float) id(g_setpoint));

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  baud_rate: 115200
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MXR Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

# ------------------------------------------------------------------ Globals ---
globals:
  - id: g_power
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: g_setpoint
    type: int
    restore_value: false
    initial_value: '20'

  - id: g_mode            # 0 Manual, 1 Auto, 2 Oil prime (Tuya encoding)
    type: int
    restore_value: false
    initial_value: '0'

  - id: g_gear            # 0..4  (P1..P5)
    type: int
    restore_value: false
    initial_value: '0'

  - id: prime_remaining
    type: int
    restore_value: false
    initial_value: '0'

  - id: prime_prev_mode
    type: int
    restore_value: false
    initial_value: '0'

# ---------------------------------------------------------------- Scripts ----
script:
  - id: send_dp
    parameters:
      dp: int
      type: int
      val: int
    then:
      - lambda: |-
          uint8_t f[16];
          uint8_t n = 0;
          f[n++] = 0x55; f[n++] = 0xAA;
          f[n++] = 0x00; f[n++] = 0x06;
          uint16_t len = 5;
          f[n++] = (len >> 8) & 0xFF;
          f[n++] = len & 0xFF;
          f[n++] = dp;
          f[n++] = type;
          f[n++] = 0x00;
          f[n++] = 0x01;
          f[n++] = val & 0xFF;

          uint8_t sum = 0;
          for (uint8_t i = 0; i < n; i++) sum += f[i];
          f[n++] = sum;

          id(heater_uart).write_array(f, n);
          id(heater_uart).flush();
          ESP_LOGI("tuya", "TX DP%d = %d", dp, val);

  - id: prime
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(prime_prev_mode) = id(g_mode);
          id(g_mode) = 2;
          id(prime_remaining) = seconds;
      - script.execute:
          id: send_dp
          dp: 4
          type: 4
          val: 2
      - while:
          condition:
            lambda: 'return id(prime_remaining) > 0;'
          then:
            - delay: 1s
            - lambda: 'id(prime_remaining)--;'
      - if:
          condition:
            lambda: 'return id(g_mode) == 2;'
          then:
            - lambda: 'id(g_mode) = id(prime_prev_mode);'
            - script.execute:
                id: send_dp
                dp: 4
                type: 4
                val: !lambda 'return id(prime_prev_mode);'

# -------------------------------------------------------------------- UART ---
uart:
  - id: heater_uart
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600

  - id: modbus_uart
    rx_pin: GPIO25
    baud_rate: 9600

# -------------------------------------------------------------------- Tuya ---
tuya:
  uart_id: heater_uart
  on_datapoint_update:
    - sensor_datapoint: 1
      datapoint_type: bool
      then:
        - lambda: |-
            id(g_power) = x;
            id(power_sw).publish_state(x);
            id(power_state).publish_state(x);

    - sensor_datapoint: 2
      datapoint_type: int
      then:
        - lambda: |-
            id(g_setpoint) = (int) x;
            id(setpoint_n).publish_state((float) x);

    - sensor_datapoint: 3
      datapoint_type: int
      then:
        - lambda: id(current_temp).publish_state(x);

    - sensor_datapoint: 4
      datapoint_type: enum
      then:
        - lambda: |-
            id(g_mode) = (int) x;
            id(mode_sel).publish_state(
              id(g_mode) == 0 ? "Manual" : (id(g_mode) == 1 ? "Auto" : "Oil prime"));

    - sensor_datapoint: 5
      datapoint_type: enum
      then:
        - lambda: |-
            id(g_gear) = (int) x;
            id(gear_sel).publish_state(std::string("P") + std::to_string(id(g_gear) + 1));

    - sensor_datapoint: 11
      datapoint_type: enum
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof buf, "State %u", (unsigned) x);
            id(work_state).publish_state(buf);

    - sensor_datapoint: 21
      datapoint_type: bitmask
      then:
        - lambda: |-
            uint32_t b = x;
            int code = 0;
            if      (b & 0x001) code = 1;
            else if (b & 0x002) code = 2;
            else if (b & 0x004) code = 3;
            else if (b & 0x008) code = 4;
            else if (b & 0x010) code = 5;
            else if (b & 0x020) code = 6;
            else if (b & 0x040) code = 7;
            else if (b & 0x800) code = 8;
            else if (b & 0x080) code = 11;
            else if (b & 0x100) code = 9;
            else if (b & 0x200) code = 10;
            id(fault_code).publish_state((float) code);
            id(fault_active).publish_state(code != 0);

# ---------------------------------------------------------------- Entities ---
switch:
  - platform: template
    name: "Heater Power"
    id: power_sw
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute:
          id: send_dp
          dp: 1
          type: 1
          val: 1
    turn_off_action:
      - script.execute:
          id: send_dp
          dp: 1
          type: 1
          val: 0

number:
  - platform: template
    name: "Setpoint"
    id: setpoint_n
    optimistic: true
    min_value: 8
    max_value: 30
    step: 1
    unit_of_measurement: "°C"
    on_value:
      - lambda: |-
          int v = (int) x;
          if (v == id(g_setpoint)) return;
          id(g_setpoint) = v;
      - script.execute:
          id: send_dp
          dp: 2
          type: 2
          val: !lambda 'return id(g_setpoint);'

  - platform: template
    name: "Prime Duration"
    id: prime_dur
    optimistic: true
    min_value: 30
    max_value: 600
    step: 10
    initial_value: 180
    unit_of_measurement: "s"

select:
  - platform: template
    name: "Mode"
    id: mode_sel
    optimistic: true
    options: ["Manual", "Auto", "Oil prime"]
    initial_option: "Manual"
    on_value:
      - lambda: |-
          int v = (x == "Manual") ? 0 : (x == "Auto" ? 1 : 2);
          if (v == id(g_mode)) return;
          id(g_mode) = v;
      - script.execute:
          id: send_dp
          dp: 4
          type: 4
          val: !lambda 'return id(g_mode);'

  - platform: template
    name: "Gear"
    id: gear_sel
    optimistic: true
    options: ["P1", "P2", "P3", "P4", "P5"]
    initial_option: "P1"
    on_value:
      - lambda: |-
          int g = x[1] - '0' - 1;
          if (g == id(g_gear)) return;
          id(g_gear) = g;
      - script.execute:
          id: send_dp
          dp: 5
          type: 4
          val: !lambda 'return id(g_gear);'

button:
  - platform: template
    name: "Prime Start"
    icon: mdi:fire
    on_press:
      - script.execute:
          id: prime
          seconds: !lambda 'return (int) id(prime_dur).state;'

  - platform: template
    name: "Prime Stop"
    icon: mdi:stop
    on_press:
      - lambda: 'id(prime_remaining) = 0;'
      - script.stop: prime
      - lambda: 'if (id(g_mode) == 2) id(g_mode) = id(prime_prev_mode);'
      - script.execute:
          id: send_dp
          dp: 4
          type: 4
          val: !lambda 'return id(prime_prev_mode);'

sensor:
  - platform: template
    name: "Current Temperature"
    id: current_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Fault Code"
    id: fault_code
    accuracy_decimals: 0
    icon: mdi:alert-outline
    update_interval: never

text_sensor:
  - platform: template
    name: "Work State"
    id: work_state
    icon: mdi:state-machine
    update_interval: never

binary_sensor:
  - platform: template
    name: "Fault Active"
    id: fault_active
    device_class: problem

  - platform: template
    name: "Power State"
    id: power_state
    device_class: running

# ------------------------------------------------------------------ Modbus ---
interval:
  - interval: 25ms
    then:
      - lambda: |-
          static std::vector<uint8_t> buf;
          static uint32_t last = 0;
          uint8_t b;
          while (id(modbus_uart).available() > 0 && id(modbus_uart).read_byte(&b)) {
            buf.push_back(b);
            last = millis();
          }
          if (buf.empty() || millis() - last <= 20) return;

          for (size_t i = 0; i + 16 < buf.size(); i++) {
            if (buf[i] == 0x01 && buf[i+1] == 0x10 &&
                buf[i+2] == 0x30 && buf[i+3] == 0x00 &&
                buf[i+4] == 0x00 && buf[i+5] == 0x04 && buf[i+6] == 0x08) {

              uint8_t st   = buf[i+7];
              uint8_t gear = (st >> 4) & 0x0F;
              uint8_t m    = st & 0x0F;
              bool power   = (m & 0x01) != 0;
              uint8_t code = (m >> 1) & 0x03;
              int temp     = (int) buf[i+8] - 16;

              ESP_LOGD("modbus", "gear=P%u mode=%u power=%s setpoint=%dC",
                       gear, code, power ? "ON" : "OFF", temp);

              id(g_setpoint) = temp;
              id(setpoint_n).publish_state((float) temp);
              break;
            }
          }

          buf.clear();
